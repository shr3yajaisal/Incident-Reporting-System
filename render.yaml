services:
  - type: web
    name: incident-response-system
    env: python
    buildCommand: |
      cd backend && 
      pip install -r requirements.txt && 
      cd ../frontend && 
      npm install && 
      npm run build && 
      cp -r dist/* ../backend/static/
    startCommand: cd backend && gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: incident-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false  # Set this in Render dashboard
      - key: SOCKETIO_ASYNC_MODE
        value: eventlet

databases:
  - name: incident-db
    databaseName: incident_db
    user: incident_user
    plan: free

